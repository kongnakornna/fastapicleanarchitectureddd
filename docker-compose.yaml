name: "erpiot"

services:
  # ═══════════════════════════════════════════════════════
  # 🐍 FastAPI Backend (เดิม — ไม่แก้)
  # ═══════════════════════════════════════════════════════
  api:
    env_file:
      - .env              # ✅ ONLY .env — NOT .env.example
    build:
      context: ./fastapi-backend
      dockerfile: Dockerfile
    container_name: erp-iot-api
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
    expose:
      - "${APPLICATION_PORT}"
    networks:
      - erp-iot-network
    ports:
      - "${APPLICATION_PORT}:8000"
    restart: unless-stopped
    volumes:
      - ./fastapi-backend:/app
    environment:
      - APPLICATION_ENVIRONMENT=${APPLICATION_ENVIRONMENT}
      - POSTGRESQL_HOST=database
      - POSTGRESQL_PORT=5437
      - POSTGRESQL_DATABASE=${POSTGRESQL_DATABASE}
      - POSTGRESQL_USERNAME=${POSTGRESQL_USERNAME}
      - POSTGRESQL_PASSWORD=${POSTGRESQL_PASSWORD}
      - REDIS_HOST=cache
      - REDIS_PORT=6378
      - REDIS_PASSWORD=${REDIS_PASSWORD}

  # ═══════════════════════════════════════════════════════
  # 🎨 Django Frontend BFF (ใหม่)
  # ═══════════════════════════════════════════════════════
  frontend:
    env_file:
      - .env              # ✅ ONLY .env — NOT .env.example
    build:
      context: ./django-frontend
      dockerfile: Dockerfile
    container_name: erp-iot-frontend
    depends_on:
      - api
    expose:
      - "${DJANGO_PORT}"
    networks:
      - erp-iot-network
    ports:
      - "${DJANGO_PORT}:8001"
    restart: unless-stopped
    volumes:
      - ./django-frontend:/app
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_DEBUG=${DJANGO_DEBUG}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS}
      - FASTAPI_BASE_URL=http://api:8000
      - FASTAPI_TIMEOUT=${FASTAPI_TIMEOUT}

  # ═══════════════════════════════════════════════════════
  # ⚡ Redis Cache
  # ═══════════════════════════════════════════════════════
  cache:
    image: "redis:8.6-alpine"
    container_name: erp-iot-cache
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD}"
      --appendonly yes
      --appendfsync everysec
      --maxmemory ${REDIS_MAX_MEMORY}
      --maxmemory-policy ${REDIS_MAX_MEMORY_POLICY}
      --databases ${REDIS_DATABASES}
    environment:
      - "REDIS_PASSWORD=${REDIS_PASSWORD}"
    expose:
      - "${REDIS_PORT}"
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG" ]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks:
      - erp-iot-network
    ports:
      - "${REDIS_PORT}:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data

  # ═══════════════════════════════════════════════════════
  # 🗄️ PostgreSQL
  # ═══════════════════════════════════════════════════════
  database:
    container_name: erp-iot-database
    image: "postgres:17-alpine"
    environment:
      - "POSTGRES_DB=${POSTGRESQL_DATABASE}"
      - "POSTGRES_USER=${POSTGRESQL_USERNAME}"
      - "POSTGRES_PASSWORD=${POSTGRESQL_PASSWORD}"
    expose:
      - "${POSTGRESQL_PORT}"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d \"$${POSTGRES_DB}\" -U \"$${POSTGRES_USER}\"" ]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks:
      - erp-iot-network
    ports:
      - "${POSTGRESQL_PORT}:5432"
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data/

  # ═══════════════════════════════════════════════════════
  # 🎛️ pgAdmin (optional)
  # ═══════════════════════════════════════════════════════
  database-admin:
    image: "dpage/pgadmin4:9.2"
    container_name: erp-iot-database-admin
    depends_on:
      database:
        condition: service_healthy
    environment:
      - "PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL}"
      - "PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}"
    expose:
      - "${PGADMIN_PORT}"
    networks:
      - erp-iot-network
    ports:
      - "${PGADMIN_PORT}:80"
    restart: unless-stopped
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  # ═══════════════════════════════════════════════════════
  # 🎛️ RedisInsight (optional)
  # ═══════════════════════════════════════════════════════
  cache-admin:
    image: "redis/redisinsight:3.4.2"
    container_name: erp-iot-cache-admin
    depends_on:
      cache:
        condition: service_healthy
    environment:
      - "RI_REDIS_HOST=cache"
      - "RI_REDIS_PORT=6378"
      - "RI_REDIS_USERNAME=${REDIS_USERNAME}"
      - "RI_REDIS_PASSWORD=${REDIS_PASSWORD}"
      - "RI_REDIS_ALIAS=${REDISINSIGHT_REDIS_ALIAS}"
    expose:
      - "${REDISINSIGHT_PORT}"
    networks:
      - erp-iot-network
    ports:
      - "${REDISINSIGHT_PORT}:5540"
    restart: unless-stopped
    volumes:
      - redisinsight_data:/data

volumes:
  postgres_data:
  pgadmin_data:
  redis_data:
  redisinsight_data:

networks:
  erp-iot-network:
    name: erp-iot-network
    driver: bridge