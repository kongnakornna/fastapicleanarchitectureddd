  #     - MQTT_BROKER=mqtt://mosquitto:1888
  #     - MQTT_CLIENT_ID=${MQTT_CLIENT_ID}
  #     - MQTT_USERNAME=${MQTT_USERNAME}
  #     - MQTT_PASSWORD=${MQTT_PASSWORD}
  #     - MQTT_KEEPALIVE=${MQTT_KEEPALIVE}
  #     - MQTT_QOS=${MQTT_QOS}
  #     - MQTT_TOPIC_DATA=${MQTT_TOPIC_DATA}
  #     - MQTT_TOPIC_CTRL=${MQTT_TOPIC_CTRL}
  #     # ─── InfluxDB (iot) ─────────────────────────
  #     - INFLUXDB_URL=http://influxdb:8096
  #     - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
  #     - INFLUXDB_ORG=${INFLUXDB_ORG}
  #     - INFLUXDB_BUCKET=${INFLUXDB_BUCKET}
  #     - INFLUXDB_TIMEOUT=${INFLUXDB_TIMEOUT}

  # ═══════════════════════════════════════════════════════
  # ⚡ Redis Cache
  # ═══════════════════════════════════════════════════════
  cache:
    image: "redis:8.6-alpine"
    container_name: erp-iot-cache
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD}"
      --appendonly yes
      --appendfsync everysec
      --maxmemory ${REDIS_MAX_MEMORY}
      --maxmemory-policy ${REDIS_MAX_MEMORY_POLICY}
      --databases ${REDIS_DATABASES}
    environment:
      - "REDIS_PASSWORD=${REDIS_PASSWORD}"
    expose:
      - "6379"
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG" ]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks:
      - erp-iot-network
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data

  # ═══════════════════════════════════════════════════════
  # 🗄️ PostgreSQL
  # ═══════════════════════════════════════════════════════
  #
  # ⚠️  IMPORTANT — Host port & binding strategy
  # ═══════════════════════════════════════════════════════
  # ปัญหา: PostgreSQL native (เช่น postgresql-x64-18) บน Windows
  #        bind ที่ [::1]:5437 (IPv6 localhost) → ชนกับ Docker
  #        ที่ bind [::]:5437 (IPv6 any) → Python resolve ผิดตัว
  #
  # แก้: 1) เปลี่ยน host port เป็น 5438 (เลี่ยง 5432/5437)
  #      2) bind เฉพาะ 127.0.0.1 (IPv4) ไม่ bind IPv6
  #         → ป้องกันการชนกับ native ที่ [::1]
  #
  # EN: Problem: native PostgreSQL binds to [::1]:5437 → conflicts
  #     with Docker's [::]:5437 → Python routes to wrong process.
  #     Fix: use port 5438 + bind IPv4 only (127.0.0.1).
  # ═══════════════════════════════════════════════════════
  database:
    container_name: erp-iot-database
    image: "postgres:17-alpine"
    environment:
      - "POSTGRES_DB=${POSTGRESQL_DATABASE}"
      - "POSTGRES_USER=${POSTGRESQL_USERNAME}"
      - "POSTGRES_PASSWORD=${POSTGRESQL_PASSWORD}"
    expose:
      - "5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d \"$${POSTGRES_DB}\" -U \"$${POSTGRES_USER}\"" ]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks:
      - erp-iot-network
    ports:
      # ── Host port (IPv4 only) ───────────────────────
      # Format: "127.0.0.1:HOST_PORT:CONTAINER_PORT"
      # host 5438 → container 5432
      - "127.0.0.1:${POSTGRESQL_HOST_PORT:-5437}:5432"
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data/

  # ═══════════════════════════════════════════════════════
  # 📡 Mosquitto MQTT Broker (iot)
  # ═══════════════════════════════════════════════════════
  # ⚠️ IMPORTANT: mosquitto.conf ต้องมี:
  #    listener 1888 0.0.0.0
  #    protocol mqtt
  #    allow_anonymous true
  # ═══════════════════════════════════════════════════════
  # mosquitto:
  #   image: "eclipse-mosquitto:2.0"
  #   container_name: erp-iot-mosquitto
  #   restart: unless-stopped
  #   networks:
  #     - erp-iot-network
  #   ports:
  #     - "${MQTT_PORT:-1888}:1888"           # MQTT (TCP)
  #     - "${MQTT_WS_PORT:-9001}:9001"        # MQTT over WebSocket
  #   volumes:
  #     # ⚠️ dev: ไม่ mount passwd (allow_anonymous=true)
  #     #    production: สร้างไฟล์จริงก่อน แล้วเปิดบรรทัดนี้:
  #     # - ./docker/mosquitto/passwd:/mosquitto/config/passwd:ro
  #     - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
  #     # - ./docker/mosquitto/passwd:/mosquitto/config/passwd:ro    ← ต้อง comment ไว้
  #     - mosquitto_data:/mosquitto/data
  #     - mosquitto_log:/mosquitto/log
  #   healthcheck:
  #     test: [ "CMD-SHELL", "mosquitto_sub -h localhost -p 1888 -t '$$SYS/#' -C 1 -W 3 || exit 1" ]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #     start_period: 10s

  # ═══════════════════════════════════════════════════════
  # 📊 InfluxDB 2.x (iot — Time-series)
  # ═══════════════════════════════════════════════════════
  influxdb:
    image: "influxdb:2.7-alpine"
    container_name: erp-iot-influxdb
    restart: unless-stopped
    networks:
      - erp-iot-network
    ports:
      - "127.0.0.1:${INFLUXDB_PORT:-8096}:8086"
    environment:
      # ─── Initial setup (ครั้งแรกเท่านั้น) ───────────
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_ADMIN_USER:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD:-adminpassword}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-erp-iot}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-iot_sensors}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:-change_me_influxdb_token}
      DOCKER_INFLUXDB_INIT_RETENTION: ${INFLUXDB_RETENTION:-90d}
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    healthcheck:
      test: [ "CMD", "influx", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ═══════════════════════════════════════════════════════
  # 🔴 Node-RED (iot — Flow-based orchestration)
  # ═══════════════════════════════════════════════════════
  # TH: ใช้สำหรับเชื่อมต่อ/ประมวลผลข้อมูล IoT แบบ flow
  #     Web UI: http://localhost:1882
  #     - MQTT  → mqtt://mosquitto:1888
  #     - InfluxDB → http://influxdb:8096
  # ═══════════════════════════════════════════════════════
  node-red:
    image: "nodered/node-red:4.0"
    container_name: erp-iot-node-red
    restart: unless-stopped
    networks:
      - erp-iot-network
    depends_on:
      # mosquitto:
      #   condition: service_healthy
      influxdb:
        condition: service_healthy
    ports:
      - "127.0.0.1:${NODE_RED_PORT:-1882}:1880"
    environment:
      - "TZ=${TZ:-Asia/Bangkok}"
      - "INFLUXDB_URL=http://influxdb:8096"
      - "INFLUXDB_TOKEN=${INFLUXDB_TOKEN}"
      - "INFLUXDB_ORG=${INFLUXDB_ORG}"
      - "INFLUXDB_BUCKET=${INFLUXDB_BUCKET}"
    volumes:
      - node_red_data:/data
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:1880/ || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ═══════════════════════════════════════════════════════
  # 🎛️ pgAdmin (optional)
  # ═══════════════════════════════════════════════════════
  database-admin:
    image: "dpage/pgadmin4:9.2"
    container_name: erp-iot-database-admin
    depends_on:
      database:
        condition: service_healthy
    environment:
      - "PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL}"
      - "PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}"
    expose:
      - "80"
    networks:
      - erp-iot-network
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-8099}:80"
    restart: unless-stopped
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  # ═══════════════════════════════════════════════════════
  # 🎛️ RedisInsight (optional)
  # ═══════════════════════════════════════════════════════
  cache-admin:
    image: "redis/redisinsight:3.4.2"
    container_name: erp-iot-cache-admin
    depends_on:
      cache:
        condition: service_healthy
    environment:
      - "RI_REDIS_HOST=cache"
      - "RI_REDIS_PORT=6379"
      - "RI_REDIS_USERNAME=${REDIS_USERNAME}"
      - "RI_REDIS_PASSWORD=${REDIS_PASSWORD}"
      - "RI_REDIS_ALIAS=${REDISINSIGHT_REDIS_ALIAS}"
    expose:
      - "5540"
    networks:
      - erp-iot-network
    ports:
      - "127.0.0.1:${REDISINSIGHT_PORT:-8081}:5540"
    restart: unless-stopped
    volumes:
      - redisinsight_data:/data

# ═══════════════════════════════════════════════════════
#  VOLUMES
# ═══════════════════════════════════════════════════════
volumes:
  postgres_data:
  pgadmin_data:
  redis_data:
  redisinsight_data:
  # mosquitto_data:
  # mosquitto_log:
  influxdb_data:
  influxdb_config:
  node_red_data:

networks:
  erp-iot-network:
    name: erp-iot-network
    driver: bridge
