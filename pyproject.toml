[project]
name = "fastapi-clean-architecture-ddd-template"
version = "3.0.0"
description = """
Python FastAPI backend template, organized by Clean Architecture layers
(domain, application, infrastructure, presentation) and DDD principles.
Includes dependency management, Docker support, testing boilerplate,
CI-friendly setup and best practices, modular scaffolding to jump-start
new projects and ensure long-term maintainability.
"""
readme = "README.md"
requires-python = ">=3.13,<3.14"

dependencies = [
    # ─── Web Framework ─────────────────────────────────────
    "fastapi[standard]>=0.135.1",
    "uvicorn[standard]>=0.53.0",
    "hypercorn>=0.18.0",
    "python-multipart>=0.0.32",
    # ─── Database ──────────────────────────────────────────
    "sqlalchemy[asyncio]>=2.0.48",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "psycopg[binary]>=3.3.3",
    "psycopg-binary>=3.3.3",
    "psycopg2-binary>=2.9.11",
    # ─── Cache / Queue ─────────────────────────────────────
    "redis>=7.4.0",
    # ─── Validation / Settings ─────────────────────────────
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "email-validator>=2.3.0",
    # ─── Auth / Crypto ─────────────────────────────────────
    "cryptography>=46.0.5",
    "jwcrypto>=1.5.6",
    "pwdlib[argon2]>=0.3.0",
    "python-jose[cryptography]>=3.5.0",
    "passlib[bcrypt]>=1.7.4",
    # ─── Observability ─────────────────────────────────────
    "loguru>=0.7.3",
    "stackprinter>=0.2.12",
    # ─── Serialization / Mapping ───────────────────────────
    "orjson>=3.11.7",
    "py-automapper>=2.2.0",
    "structlog>=26.1.0",
    "paho-mqtt>=2.1.0",
    "influxdb-client>=1.50.0",
    # ─── iot Module (Parts 8-14) ───────────────────────────
    "httpx>=0.28.1",              # Part 10: alerting HTTP clients
    "apscheduler>=3.10.4",        # Part 11: scheduler cron jobs
]

[project.optional-dependencies]
# TH: event streaming (เปิดเมื่อใช้ Kafka)
# EN: event streaming (enable when using Kafka)
events = [
    "aiokafka>=0.12.0",
]

# TH: security scanning (แยกออกเพื่อไม่ให้ prod image หนัก)
# EN: security scanning (split out to keep prod image lean)
security-scan = [
    "bandit[toml]>=1.8.0",
    "pip-audit>=2.7.0",
]

# TH: alerting channels (LINE/Telegram/webhook) — ใช้ httpx ที่อยู่ใน core แล้ว
# EN: alerting channels — httpx already in core
alerting = [
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "alembic>=1.20.0",
    "mypy>=2.3.1",
    "ngrok>=1.7.0",
    "ruff>=0.15.4",
    "pre-commit>=4.0.0",
    "websockets>=17.1",
    "httpx>=0.28.1",
    "apscheduler>=3.10.4",
]

test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6.0.0",
    "pytest-benchmark>=5.0.0",
    "pytest-xdist>=3.6.0",
    "hypothesis>=6.100.0",
    "testcontainers[postgres,redis]>=4.8.0",
    "faker>=30.0.0",
    "freezegun>=1.5.0",
    "respx>=0.21.0",
    "httpx>=0.27.0",
]

# ═══════════════════════════════════════════════════════════════
# UV CONFIG
# ═══════════════════════════════════════════════════════════════
[tool.uv]
default-groups = ["dev", "test"]

# ═══════════════════════════════════════════════════════════════
# RUFF — LINT + FORMAT
# ═══════════════════════════════════════════════════════════════
[tool.ruff]
target-version = "py313"
line-length = 88
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "PL",   # pylint
    "ASYNC",# flake8-async
]
ignore = [
    "BLE001",   # blind-except — intentional in infra layer (2-branch)
    "PLR0913",  # too-many-arguments — use cases inject many ports
    "PLR0912",  # too-many-branches — alerting dispatcher has many channels
    "PLR0915",  # too-many-statements — use_case has large methods
]

[tool.ruff.lint.per-file-ignores]
"app/modules/*/infrastructure/models.py" = ["UP037"]
"app/modules/iot/infrastructure/alerting/*.py" = ["PLR2004", "TRY300"]
"app/modules/iot/infrastructure/scheduler/*.py" = ["PLR2004"]
"app/modules/iot/infrastructure/ws_broadcaster.py" = ["BLE001"]
"app/modules/iot/infrastructure/idempotency.py" = ["BLE001"]
"app/modules/iot/infrastructure/tenant_context.py" = ["BLE001"]
"app/middleware/*.py" = ["BLE001"]
"tests/**/*.py" = ["PLR2004", "S101", "BLE001"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Security",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false

# ═══════════════════════════════════════════════════════════════
# MYPY — STRICT TYPE CHECK
# ═══════════════════════════════════════════════════════════════
[tool.mypy]
python_version = "3.13"
files = "app/"
show_error_codes = true
warn_unused_configs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
disallow_untyped_defs = true
disallow_any_generics = true
pretty = true

# TH: SQLAlchemy models + Pydantic/py-automapper ใช้ metaclass/dynamic attribute
#     suppress เฉพาะ module ที่ noisy
# EN: SQLAlchemy models + Pydantic/py-automapper rely on metaclass/dynamic
#     suppress only the noisy modules
[[tool.mypy.overrides]]
module = [
    "app.modules.*.infrastructure.models",
    "app.core.security",
    "app.main",
    "app.dependencies",
]
ignore_errors = true

# TH: alerting handlers ใช้ HTTP client + exception handling ที่อาจไม่สมบูรณ์
# EN: alerting handlers use HTTP clients with lenient exception handling
[[tool.mypy.overrides]]
module = [
    "app.modules.iot.infrastructure.alerting.*",
    "app.modules.iot.infrastructure.ws_broadcaster",
    "app.modules.iot.infrastructure.idempotency",
    "app.modules.iot.infrastructure.scheduler.*",
]
ignore_errors = true

# ═══════════════════════════════════════════════════════════════
# PYTEST
# ═══════════════════════════════════════════════════════════════
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = """
    -ra
    --strict-markers
    --strict-config
    --cov=app
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-fail-under=80
"""
markers = [
    "unit: Unit tests (fast, no IO)",
    "integration: Integration tests (DB/Redis)",
    "property: Property-based tests",
    "slow: Slow tests (> 1s)",
    "manual: Manual test scenarios",
]

# ═══════════════════════════════════════════════════════════════
# COVERAGE
# ═══════════════════════════════════════════════════════════════
[tool.coverage.run]
branch = true
source = ["app"]
omit = [
    "*/__init__.py",
    "*/migrations/*",
    "tests/*",
    # TH: alerting handlers เป็น HTTP-only — ไม่มี unit test ครอบคลุม
    # EN: alerting handlers are HTTP-only — not covered by unit tests
    "app/modules/iot/infrastructure/alerting/email_handler.py",
    "app/modules/iot/infrastructure/alerting/line_handler.py",
    "app/modules/iot/infrastructure/alerting/telegram_handler.py",
    "app/modules/iot/infrastructure/alerting/webhook_handler.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "if __name__ == .__main__.:",
]
show_missing = true
precision = 2

# ═══════════════════════════════════════════════════════════════
# HYPOTHESIS — property-based testing
# ═══════════════════════════════════════════════════════════════
[tool.hypothesis]
max_examples = 200
deadline = 500  # ms
verbosity = "normal"

# ═══════════════════════════════════════════════════════════════
# BANDIT — SECURITY
# ═══════════════════════════════════════════════════════════════
[tool.bandit]
exclude_dirs = ["tests", ".venv", "migrations"]
skips = ["B101"]  # TH: assert ใน test | EN: assert in tests

# TH: ข้าม warning ของ use ของ random ใน demo/seed data
# EN: skip random-use warnings for demo/seed data
[tool.bandit.assert_used]
skips = ["*_test.py", "test_*.py"]
