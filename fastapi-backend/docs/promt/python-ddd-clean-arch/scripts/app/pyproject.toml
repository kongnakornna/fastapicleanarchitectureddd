[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "python-ddd-clean-arch"
version = "1.0.0"
description = "Production-ready DDD + Clean Architecture for FastAPI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi==0.115.*",
    "uvicorn[standard]==0.32.*",
    "gunicorn==23.*",
    "pydantic==2.10.*",
    "pydantic-settings==2.6.*",
    "sqlalchemy[asyncio]==2.0.*",
    "asyncpg==0.30.*",
    "alembic==1.14.*",
    "redis[hiredis]==5.2.*",
    "aiokafka==0.12.*",
    "structlog==24.4.*",
    "python-json-logger==2.0.*",
    "python-multipart==0.0.*",
    "orjson==3.10.*",
    "tenacity==9.0.*",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.*",
    "pytest-asyncio==0.24.*",
    "pytest-cov==6.0.*",
    "pytest-benchmark==5.1.*",
    "pytest-xdist==3.6.*",
    "hypothesis==6.115.*",
    "testcontainers[postgres,redis]==4.8.*",
    "faker==30.*",
    "freezegun==1.5.*",
    "respx==0.21.*",
]
dev = [
    "ruff==0.7.*",
    "mypy==1.13.*",
    "bandit[toml]==1.7.*",
    "pip-audit==2.7.*",
    "pre-commit==4.0.*",
    "py-spy==0.4.*",
    "memray==1.15.*",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = """
    -ra
    --strict-markers
    --strict-config
    --cov=app
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-fail-under=85
"""
markers = [
    "unit: Unit tests (fast, no IO)",
    "integration: Integration tests (DB/Redis)",
    "property: Property-based tests",
    "slow: Slow tests (> 1s)",
]

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["*/__init__.py", "*/migrations/*", "tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "S", "ASYNC", "T20"]
ignore = ["E501", "B008", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "SLF001"]
"app/**/migrations/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_unimported = false

[tool.bandit]
exclude_dirs = ["tests", "migrations"]