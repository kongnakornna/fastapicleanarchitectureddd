{% load i18n %}
<div class="settings" x-data>
  <a href="javascript:void(0)"
     class="btn btn-floating btn-icon btn-primary"
     data-bs-toggle="offcanvas" data-bs-target="#offcanvas-settings"
     aria-label="{% trans 'layout.settings.title' %}">
    {% include "partials/icons.html" with icon="palette" %}
  </a>

  <div class="offcanvas offcanvas-start offcanvas-narrow" tabindex="-1"
       id="offcanvas-settings" role="dialog" aria-modal="true"
       aria-labelledby="offcanvas-settings-title">
    <div class="offcanvas-header">
      <h2 class="offcanvas-title" id="offcanvas-settings-title">
        {% trans "layout.settings.title" %}
      </h2>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas"
              aria-label="{% trans 'common.close' %}"></button>
    </div>
    <div class="offcanvas-body d-flex flex-column">
      <div>
        {# ... rest unchanged ... #}
      </div>

      <div class="mt-auto">
        <button type="button" class="btn w-100 mb-2"
                @click.prevent="$store.theme.reset()">
          {% trans "layout.settings.reset" %}
        </button>
        <a href="javascript:void(0)" class="btn btn-primary w-100"
           data-bs-dismiss="offcanvas">
          {% trans "layout.settings.save" %}
        </a>
      </div>
    </div>
  </div>
</div>
