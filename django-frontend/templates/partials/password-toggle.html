{% load i18n icons %}
{# ใช้กับ Alpine state: passwordVisible #}

   title="{% trans 'common.password' %}"
   @click.prevent="passwordVisible = !passwordVisible">

  <span x-show="passwordVisible">{% include "partials/icons.html" with icon="eye-off" %}</span>
</a>
