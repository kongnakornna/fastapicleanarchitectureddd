{% load i18n %}
{# Floating theme builder — เหมือน layout-settings แต่ใช้ offcanvas #themeBuilder #}
<div class="offcanvas offcanvas-start" tabindex="-1" id="themeBuilder" x-data>
  <div class="offcanvas-header">
    <h2 class="offcanvas-title">{% trans "layout.settings.title" %}</h2>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas"
            aria-label="{% trans 'common.close' %}"></button>
  </div>
  <div class="offcanvas-body d-flex flex-column">
    <div class="mb-3">
      <label class="form-label">{% trans "layout.settings.colorMode" %}</label>
      <div class="form-selectgroup">
        <label class="form-selectgroup-item">
          <input type="radio" name="tb-theme" value="light" class="form-selectgroup-input"
                 :checked="$store.theme.mode === 'light'"
                 @change="$store.theme.set('light')">
          <span class="form-selectgroup-label">{% trans "layout.settings.lightmode" %}</span>
        </label>
        <label class="form-selectgroup-item">
          <input type="radio" name="tb-theme" value="dark" class="form-selectgroup-input"
                 :checked="$store.theme.mode === 'dark'"
                 @change="$store.theme.set('dark')">
          <span class="form-selectgroup-label">{% trans "layout.settings.darkmode" %}</span>
        </label>
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">{% trans "layout.settings.colorScheme" %}</label>
      <div class="row g-2">
        {% for t in layout_themes %}
          <div class="col-auto">
            <label class="form-colorinput">
              <input type="radio" name="tb-primary" value="{{ t.key }}"
                     class="form-colorinput-input"
                     :checked="$store.theme.primary === '{{ t.key }}'"
                     @change="$store.theme.setPrimary('{{ t.key }}')">
              <span class="form-colorinput-color {{ t.class }}"></span>
            </label>
          </div>
        {% endfor %}
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">{% trans "layout.settings.fontFamily" %}</label>
      <div class="form-selectgroup">
        {% for f in layout_fonts %}
          <label class="form-selectgroup-item">
            <input type="radio" name="tb-font" value="{{ f.key }}" class="form-selectgroup-input"
                   :checked="$store.theme.font === '{{ f.key }}'"
                   @change="$store.theme.setFont('{{ f.key }}')">
            <span class="form-selectgroup-label">{% trans f.label %}</span>
          </label>
        {% endfor %}
      </div>
    </div>

    <div class="mt-auto">
      <button type="button" class="btn w-100 mb-2"
              @click.prevent="$store.theme.reset()">
        {% trans "layout.settings.reset" %}
      </button>
      <a href="javascript:void(0)" class="btn btn-primary w-100"
         data-bs-dismiss="offcanvas">
        {% trans "common.save" %}
      </a>
    </div>
  </div>
</div>
