{% extends "layout/app_layout.html" %}
{% load i18n %}

{% block page_header %}
{% include "partials/page-header.html" with title="user.me.title" icon="user" %}
{% endblock %}

{% block content %}
<div class="page-body">
  <div class="container-xl">
    <div class="card">
      <div class="card-body">
        <h3 class="card-title">{{ me.username }}</h3>
        <p class="text-secondary">{{ me.email|default:"" }}</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
