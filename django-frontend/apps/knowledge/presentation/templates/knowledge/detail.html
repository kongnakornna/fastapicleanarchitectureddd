{% extends "layout/app_layout.html" %}
{% load i18n %}

{% block content %}
<div class="page-body">
  <div class="container-xl">
    <div class="card">
      <div class="card-header">
        <h3 class="card-title">{{ doc.title }}</h3>
      </div>
      <div class="card-body">
        <dl class="row">
          <dt class="col-2">Source</dt><dd class="col-10">{{ doc.source }}</dd>
          <dt class="col-2">Chunks</dt><dd class="col-10">{{ doc.chunk_count }}</dd>
          <dt class="col-2">Status</dt><dd class="col-10"><span class="badge {{ doc.badge_class }}">{{ doc.status }}</span></dd>
        </dl>
      </div>
    </div>
  </div>
</div>
{% endblock %}
